<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperclip Console</title>
<link rel="stylesheet" href="/canonical/v2/styles.css?authoredForAppVersion=1.4.23">
<script type="module" src="/canonical/v2/components.js"></script>
<link rel="stylesheet" href="./console.css">
</head>
<body>
  <header>
    <div><h1 id="title">Paperclip Console</h1><p id="subtitle">Connecting…</p></div>
    <span id="live" class="pill idle"><span id="live-text">Connecting</span></span>
  </header>
  <p id="toast" class="toast" hidden></p>
  <main>
    <section id="agents"><h2>Agents</h2><div id="agents-body"></div></section>
    <section id="new"><h2>New task</h2>
      <form id="new-form">
        <label for="n-title">Title</label><input id="n-title" required maxlength="300">
        <label for="n-desc">Details</label><textarea id="n-desc" rows="3"></textarea>
        <div class="row">
          <div><label for="n-agent">Assign to</label><select id="n-agent"></select></div>
          <div><label for="n-prio">Priority</label>
            <select id="n-prio"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select></div>
        </div>
        <button type="submit">Create task</button>
      </form>
    </section>
    <section id="approvals" hidden><h2>Pending approvals</h2><div id="approvals-body"></div></section>
    <section id="tasks"><h2>Tasks</h2><div id="tasks-body"></div></section>
    <section id="runs"><h2>Recent runs</h2><div id="runs-body"></div></section>
  </main>
  <script type="module" src="./console.js"></script>
</body>
</html>
