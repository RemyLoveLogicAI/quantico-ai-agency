[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantico-agent"
version = "0.1.2"
description = "Quantico AI Agency — a recursive LLM investigation agent for financial forensics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "pyfiglet>=1.0",
]

[project.optional-dependencies]
textual = [
    "textual>=0.89",
    "networkx>=3.2",
    "numpy>=1.24",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
quantico-agent = "agent.__main__:main"

[tool.setuptools.packages.find]
include = ["agent*", "scripts*"]
